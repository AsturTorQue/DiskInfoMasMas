[package]
name = "diskinfo"
version = "0.2.0"
edition = "2021"
description = "DiskInfo: disk health (S.M.A.R.T.) and temperature viewer for Linux, Windows and macOS"
license = "MIT"
readme = "README.md"
repository = "https://github.com/AsturTorQue/Diskinfo-for-linux"
keywords = ["smart", "disk", "health", "nvme", "s-m-a-r-t"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "linux")'.dependencies]
sha2 = "0.10"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
