[package]
name = "info-discos"
version = "0.1.0"
edition = "2021"
description = "CrystalDiskInfo for Linux: disk health (S.M.A.R.T.) and temperature viewer"
license = "MIT"
readme = "README.md"
repository = "https://github.com/AsturTorQue/Diskinfo-for-linux"
keywords = ["smart", "disk", "health", "nvme", "linux"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 2
