# Builds DiskInfo for Linux, Windows and macOS (Intel/AMD and ARM) and, for a version tag
# (v1.2.3), attaches every package to that tag's GitHub release.
# Run it by hand from the Actions tab too (workflow_dispatch): then the packages are only
# kept as downloadable artifacts of the run.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 g++ make
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x appimagetool
      - name: Build AppImage
        run: ARCH=${{ matrix.arch }} packaging/build-appimage.sh "$PWD/appimagetool"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.AppImage

  smartctl-windows:
    name: smartctl for Windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile with mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 g++ make
          packaging/build-smartctl.sh windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: smartctl-windows
          path: |
            target/smartctl.exe
            target/smartmontools-license/COPYING

  windows:
    name: Windows ${{ matrix.arch }}
    needs: smartctl-windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: smartctl-windows
          path: target
      - name: Build zip
        shell: pwsh
        run: packaging\build-windows.ps1 -Target ${{ matrix.target }} -Arch ${{ matrix.arch }} -Smartctl target\smartctl.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip

  macos:
    name: macOS (Intel + Apple silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Build app
        run: packaging/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    steps:
      # Only the finished packages (not the helper smartctl-windows artifact).
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: packages
          merge-multiple: true
      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          generate_release_notes: true
